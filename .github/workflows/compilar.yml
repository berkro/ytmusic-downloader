# Genera la aplicación para Windows (.exe) cada vez que se sube un cambio a "main"
# y la publica en la sección «Releases» del repositorio como «Última versión».
name: Compilar para Windows

on:
  push:
    branches: [main]
  workflow_dispatch:   # permite lanzarlo a mano desde la pestaña «Actions»

permissions:
  contents: write      # necesario para publicar la release

jobs:
  compilar:
    runs-on: windows-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Crear el .exe con PyInstaller
        run: >
          pyinstaller --noconfirm --windowed --onedir
          --name "YT Music Descargador"
          --icon icono.ico
          --add-data "icono.ico;."
          --collect-data ytmusicapi
          --exclude-module yt_dlp
          ytmusic_descargador.py

      - name: Añadir yt-dlp, ffmpeg y deno a la carpeta bin
        shell: pwsh
        run: |
          $bin = "dist/YT Music Descargador/bin"
          New-Item -ItemType Directory -Force $bin | Out-Null
          Invoke-WebRequest "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "$bin/yt-dlp.exe"
          Invoke-WebRequest "https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          Get-ChildItem ffmpeg_tmp -Recurse -Include ffmpeg.exe, ffprobe.exe | Copy-Item -Destination $bin
          Invoke-WebRequest "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip" -OutFile deno.zip
          Expand-Archive deno.zip -DestinationPath $bin
          Get-ChildItem $bin

      - name: Comprobar que todo funciona
        shell: pwsh
        run: |
          $bin = "dist/YT Music Descargador/bin"
          foreach ($f in "yt-dlp.exe", "ffmpeg.exe", "ffprobe.exe", "deno.exe") {
            if (-not (Test-Path "$bin/$f")) { throw "Falta $f" }
          }
          & "$bin/yt-dlp.exe" --version
          & "$bin/deno.exe" --version
          & "$bin/ffmpeg.exe" -hide_banner -version | Select-Object -First 1
          if (-not (Test-Path "dist/YT Music Descargador/YT Music Descargador.exe")) { throw "No se generó el .exe" }

      - name: Comprimir en un .zip
        shell: pwsh
        run: Compress-Archive -Path "dist/YT Music Descargador" -DestinationPath "YT-Music-Descargador-Windows.zip"

      - name: Guardar el .zip como artefacto de la ejecución
        uses: actions/upload-artifact@v4
        with:
          name: YT-Music-Descargador-Windows
          path: YT-Music-Descargador-Windows.zip

      - name: Publicar en Releases como «Última versión»
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>$null
          $global:LASTEXITCODE = 0
          gh release create latest "YT-Music-Descargador-Windows.zip" `
            --title "Última versión" `
            --target $env:GITHUB_SHA `
            --notes "Descarga **YT-Music-Descargador-Windows.zip**, descomprímelo y abre «YT Music Descargador.exe». Consulta el README para la guía completa."
